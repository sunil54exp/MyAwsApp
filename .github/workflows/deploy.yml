name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Triggers deployment when pushing to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Set your .NET version (e.g., 6.0.x, 8.0.x)

      - name: Build and Publish .NET Application
        run: |
          dotnet restore
          dotnet publish -c Release -o ./publish

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            # 1. Stop the running .NET service
            sudo systemctl stop MyAwsApp.service

            # 2. Deploy .NET binaries
            sudo rm -rf /var/www/MyAwsApp/*
            
            # 3. Restart .NET service
            sudo systemctl start MyAwsApp.service

      - name: Copy .NET Build Files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "./publish/*"
          target: "/var/www/MyAwsApp"
          strip_components: 1

      - name: Copy Static Site Files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "./static-site/*" # Path to your static files folder in repo
          target: "/var/www/sunilmanu"
          strip_components: 1

      - name: Restart Services on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            sudo systemctl restart MyAwsApp.service
            sudo systemctl reload nginx